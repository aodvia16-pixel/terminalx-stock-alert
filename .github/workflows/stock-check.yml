name: Terminal X stock check

on:
  schedule:
    - cron: "7 6,14,22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: pip install playwright

      - name: Install Chromium
        run: playwright install --with-deps chromium

      - name: Check Terminal X stock
        env:
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: python check_stock.py

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminalx-screenshot
          path: terminalx.png
          if-no-files-found: ignore

      - name: Save state
        run: |
          git config user.name "stock-bot"
          git config user.email "stock-bot@users.noreply.github.com"
          git pull
          git add state.txt
          git diff --cached --quiet || git commit -m "Update stock state"
          git push
